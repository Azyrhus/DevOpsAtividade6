<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conversor de unidades</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; display: flex; justify-content: center; padding: 3rem 1rem; }
    main { background: #1e293b; border-radius: 12px; padding: 2rem; width: 100%; max-width: 420px; }
    h1 { margin-top: 0; color: #38bdf8; font-size: 1.5rem; }
    label { display: block; margin: 1rem 0 0.3rem; }
    input, select, button { width: 100%; padding: 0.6rem; border-radius: 8px; border: none; font-size: 1rem; box-sizing: border-box; }
    button { background: #38bdf8; color: #0f172a; font-weight: 600; margin-top: 1rem; cursor: pointer; }
    #resultado { margin-top: 1.2rem; font-size: 1.2rem; min-height: 1.5rem; }
    a { color: #7dd3fc; }
    footer { margin-top: 1.5rem; font-size: 0.85rem; color: #94a3b8; }
  </style>
</head>
<body>
  <main>
    <h1>Conversor de unidades</h1>

    <label for="valor">Valor</label>
    <input id="valor" type="number" step="any" value="100">

    <label for="tipo">Conversão</label>
    <select id="tipo">
      <option value="celsiusParaFahrenheit">°C → °F</option>
      <option value="fahrenheitParaCelsius">°F → °C</option>
      <option value="quilometrosParaMilhas">km → milhas</option>
      <option value="milhasParaQuilometros">milhas → km</option>
    </select>

    <button id="converter">Converter</button>
    <p id="resultado"></p>

    <footer>
      Publicado automaticamente pela pipeline do GitHub Actions ·
      <a href="./cobertura/index.html">Relatório de cobertura de testes</a>
    </footer>
  </main>

  <script src="./conversor.js"></script>
  <script>
    document.getElementById('converter').addEventListener('click', function () {
      var valor = parseFloat(document.getElementById('valor').value);
      var tipo = document.getElementById('tipo').value;
      var saida = document.getElementById('resultado');
      try {
        saida.textContent = 'Resultado: ' + window.Conversor[tipo](valor).toFixed(2);
      } catch (erro) {
        saida.textContent = 'Digite um número válido.';
      }
    });
  </script>
</body>
</html>
